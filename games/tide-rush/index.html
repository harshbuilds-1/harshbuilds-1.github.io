<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tide Rush — Harsh Kumar</title>
<meta name="description" content="An endless runner on a sunset boardwalk with a giant wave on your heels. A Unity game by Harsh Kumar. Plays in the browser with keyboard or swipe.">
<meta property="og:type" content="website">
<meta property="og:title" content="Tide Rush — outrun the wave">
<meta property="og:description" content="An endless runner on a sunset boardwalk with a giant wave on your heels. Unity, by Harsh Kumar. Art by Kenney (CC0).">
<meta property="og:image" content="https://harshbuilds-1.github.io/games/img/tide-rush.jpg">
<meta property="og:url" content="https://harshbuilds-1.github.io/games/tide-rush/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#2a1c3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tide Rush">
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;height:100%;background:#2a1c3a;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#unity-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#loader{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:linear-gradient(#ffb36b,#e86a7a 55%,#3a2a6a);z-index:3}
#loader b{font-size:54px;letter-spacing:.06em;text-shadow:0 4px 0 #1a1530}
#bar{width:min(320px,70vw);height:10px;border-radius:99px;background:rgba(0,0,0,.25);margin:22px auto 0;overflow:hidden}
#fill{height:100%;width:0;background:#ffd04a;border-radius:99px;transition:width .2s}
#fs{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:2;width:40px;height:40px;
  border:0;border-radius:12px;background:rgba(20,16,40,.4);color:#fff;display:none;place-items:center;cursor:pointer;touch-action:manipulation}
#fs svg{width:20px;height:20px}
#fs.on{display:grid}
#rotate{position:fixed;inset:0;z-index:4;display:none;place-items:center;text-align:center;padding:24px;
  background:linear-gradient(#ffb36b,#e86a7a 55%,#3a2a6a)}
#rotate b{display:block;font-size:30px;margin:18px 0 8px;text-shadow:0 3px 0 #1a1530}
#rotate p{margin:0;font-size:16px;opacity:.9;max-width:300px}
#rotate .phone{width:54px;height:90px;border:5px solid #fff;border-radius:12px;margin:0 auto;animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:grid}}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loader"><div><b>TIDE RUSH</b><div id="bar"><div id="fill"></div></div></div></div>
<button id="fs" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<div id="rotate"><div><div class="phone"></div><b>Turn your phone sideways</b><p>Tide Rush plays in landscape. Swipe to switch lanes, jump and slide.</p><p id="tip"></p></div></div>
<script src="Build/WebGL.loader.js"></script>
<script>
var game = null, root = document.documentElement, fs = document.querySelector('#fs');
var coarse = matchMedia('(pointer:coarse)').matches;
var canFull = !!(root.requestFullscreen || root.webkitRequestFullscreen);
var standalone = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone;
function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function syncButton() { fs.classList.toggle('on', canFull && !isFull() && !standalone); }
fs.addEventListener('click', function () {
  var req = root.requestFullscreen || root.webkitRequestFullscreen;
  Promise.resolve(req.call(root)).then(function () {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
  }).catch(function () {});
  document.querySelector('#unity-canvas').focus();
});
document.addEventListener('fullscreenchange', syncButton);
document.addEventListener('webkitfullscreenchange', syncButton);
// iPhone Safari can't make a page full screen; Add to Home Screen opens it without the browser bars.
if (coarse && !canFull && !standalone) document.querySelector('#tip').textContent = 'For full screen: Share → Add to Home Screen.';
function pause() { if (game) game.SendMessage('Game', 'WebPause'); }
var portrait = matchMedia('(orientation:portrait)');
(portrait.addEventListener ? portrait.addEventListener('change', function (e) { if (e.matches && coarse) pause(); }) : 0);
document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });
createUnityInstance(document.querySelector('#unity-canvas'), {
  dataUrl: 'Build/WebGL.data.unityweb', frameworkUrl: 'Build/WebGL.framework.js.unityweb', codeUrl: 'Build/WebGL.wasm.unityweb',
  companyName: 'Harsh Kumar', productName: 'Tide Rush', productVersion: '0.1',
  matchWebGLToCanvasSize: true, devicePixelRatio: Math.min(window.devicePixelRatio || 1, coarse ? 1.5 : 2)
}, function (p) { document.querySelector('#fill').style.width = (p * 100) + '%'; })
.then(function (u) { game = u; document.querySelector('#loader').remove(); syncButton(); document.querySelector('#unity-canvas').focus(); })
.catch(function () { document.querySelector('#loader').textContent = 'This game needs a browser with WebGL 2.'; });
</script>
</body>
</html>
