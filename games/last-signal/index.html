<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Last Signal — Harsh Kumar</title>
<style>
html,body{margin:0;height:100%;background:#04060d;overflow:hidden;font-family:system-ui,sans-serif;color:#eef1f6}
#unity-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#loader{position:fixed;inset:0;display:grid;place-items:center;text-align:center;letter-spacing:.3em;font-size:13px}
#bar{width:min(320px,70vw);height:3px;background:#1b2130;margin:18px auto 0;overflow:hidden}
#fill{height:100%;width:0;background:#5fe3cc;transition:width .2s}
#hint{position:fixed;bottom:14px;width:100%;text-align:center;font-size:12px;color:#7f8aa0;letter-spacing:.08em}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loader"><div>LAST SIGNAL<div id="bar"><div id="fill"></div></div></div></div>
<div id="hint">Keyboard, gamepad or touch · click the game first</div>
<script src="Build/WebGL.loader.js"></script>
<script>
if (matchMedia('(pointer: coarse)').matches) document.querySelector('#hint').textContent = 'Touch controls · play in landscape';
createUnityInstance(document.querySelector('#unity-canvas'), {
  dataUrl: 'Build/WebGL.data.unityweb', frameworkUrl: 'Build/WebGL.framework.js.unityweb', codeUrl: 'Build/WebGL.wasm.unityweb',
  companyName: 'Harsh Kumar', productName: 'Last Signal', productVersion: '0.1',
  matchWebGLToCanvasSize: true, devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
}, p => { document.querySelector('#fill').style.width = (p * 100) + '%'; })
.then(() => { document.querySelector('#loader').remove(); setTimeout(() => document.querySelector('#hint').remove(), 6000); document.querySelector('#unity-canvas').focus(); })
.catch(e => { document.querySelector('#loader').textContent = 'This game needs a desktop browser with WebGL 2.'; });
</script>
</body>
</html>
